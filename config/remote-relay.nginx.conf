# IP-certificate deployment using the existing nginx process.
# Replace PUBLIC_IP before enabling. Issue the relay-ip certificate first.
# Add the ACME location from docs/guides/mobile-relay-nginx.md to the existing
# port-80 server; this file intentionally does not define another port-80 server.
server {
    listen 8443 ssl;
    server_name PUBLIC_IP;

    ssl_certificate /etc/letsencrypt/live/relay-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
