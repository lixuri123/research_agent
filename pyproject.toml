[project]
name = "research-agent"
version = "0.1.0"
description = "基于 LangGraph 的多智能体科研助手：论文检索、内容总结与研究报告生成"
requires-python = ">=3.10,<3.13"
dependencies = [
    "langsmith>=0.14.1,<0.15",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "openai>=1.40.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=16,<17",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "pymilvus>=2.4.0",
    "redis>=5.0.0",
    "pypdf>=4.3.0",
    "httpx>=0.27.0",
    "mcp>=1.26,<2",
    "jsonschema>=4.23,<5",
    "pyyaml>=6,<7",
    "python-dotenv>=1.0.0",
    "tenacity>=8.4.0",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "langgraph-checkpoint-sqlite>=2,<4",
    "langgraph-checkpoint-postgres>=2,<4",
]

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["research_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.tmp/pytest"
cache_dir = ".tmp/pytest-cache"
